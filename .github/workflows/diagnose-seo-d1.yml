name: Diagnose SEO D1

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Query D1 state
        run: |
          npx wrangler d1 execute suhanur-blog --remote --json --command="SELECT 'categories' AS kind,id,name,slug FROM categories ORDER BY id; SELECT 'tags' AS kind,id,name,slug FROM tags ORDER BY id; SELECT 'slug_conflicts' AS kind,id,title,slug FROM posts WHERE slug IN ('ai-hallucination-chatgpt-bhul-tothyo-guide','nijer-data-ai-ke-dile-privacy-jhuki-guide','bangla-ai-karon-simaboddhota-analysis','browser-fingerprinting-website-apnar-tottho-guide','bangladesh-jobseekers-ai-cv-guide-2026','survey-data-cleaning-research-data-guide','research-sample-size-nirdharon-guide','survey-questionnaire-design-15-rules-guide','full-stack-developer-roadmap-bangla-guide','cse-student-10-important-skills-guide','data-analyst-vs-software-engineer-career-guide','programmer-skills-ai-era-guide') ORDER BY slug;" > d1-diagnosis.json
      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: d1-diagnosis
          path: d1-diagnosis.json
          retention-days: 1
