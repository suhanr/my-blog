name: Migrate WordPress to D1 and R2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: wordpress-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'MIGRATE-WORDPRESS-ONCE'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WP_URL: https://blog.suhanurrahman.com
      LEGACY_WP_IP: 162.0.229.133
      LEGACY_SERVER_NAME: premium120.web-hosting.com
      MEDIA_IMPORT_TOKEN: ${{ secrets.MEDIA_IMPORT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Export WordPress content from legacy origin
        run: node scripts/export-wordpress.mjs

      - name: Merge unpublished and special WordPress records
        run: node scripts/merge-wordpress-supplement.mjs

      - name: Import all WordPress uploads into R2
        run: node scripts/migrate-wordpress-media.mjs

      - name: Build complete D1 import SQL
        run: node scripts/build-import-sql.mjs

      - name: Apply D1 schema migrations
        run: npx wrangler d1 migrations apply suhanur-blog --remote

      - name: Import WordPress content into D1
        run: npx wrangler d1 execute suhanur-blog --remote --file=migration-data/import.sql --yes

      - name: Verify migration counts
        run: |
          npx wrangler d1 execute suhanur-blog --remote --json --command="SELECT (SELECT COUNT(*) FROM posts) AS posts, (SELECT COUNT(*) FROM posts WHERE status='PUBLISHED') AS published_posts, (SELECT COUNT(*) FROM posts WHERE status='DRAFT') AS draft_posts, (SELECT COUNT(*) FROM categories) AS categories, (SELECT COUNT(*) FROM tags) AS tags, (SELECT COUNT(*) FROM post_categories) AS post_categories, (SELECT COUNT(*) FROM post_tags) AS post_tags, (SELECT COUNT(*) FROM comments) AS comments;"

      - name: Commit generated migration manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-data/media-manifest.json
          git diff --cached --quiet || git commit -m "Record WordPress media migration manifest"
          git push
