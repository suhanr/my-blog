name: Migrate WordPress to D1

on:
  workflow_dispatch:

concurrency:
  group: wordpress-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WP_URL: https://blog.suhanurrahman.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Export WordPress content
        run: node scripts/export-wordpress.mjs

      - name: Build D1 import SQL
        run: node scripts/build-import-sql.mjs

      - name: Import WordPress content into D1
        run: npx wrangler d1 execute suhanur-blog --remote --file=migration-data/import.sql --yes

      - name: Verify imported content
        run: |
          npx wrangler d1 execute suhanur-blog --remote --json --command="SELECT 'posts' AS table_name, COUNT(*) AS count FROM posts UNION ALL SELECT 'categories', COUNT(*) FROM categories UNION ALL SELECT 'tags', COUNT(*) FROM tags UNION ALL SELECT 'comments', COUNT(*) FROM comments;"
