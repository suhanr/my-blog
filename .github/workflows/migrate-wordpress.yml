name: Migrate WordPress to D1 and R2

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: wordpress-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'MIGRATE-WORDPRESS-ONCE'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WP_URL: https://blog.suhanurrahman.com
      LEGACY_WP_IP: 162.0.229.133
      LEGACY_SERVER_NAME: premium120.web-hosting.com
      MEDIA_BUCKET: suhanur-blog-media

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Export WordPress content from legacy origin
        run: node scripts/export-wordpress.mjs

      - name: Import WordPress media into R2
        run: node scripts/migrate-wordpress-media.mjs

      - name: Build D1 import SQL
        run: node scripts/build-import-sql.mjs

      - name: Apply D1 schema migrations
        run: npx wrangler d1 migrations apply suhanur-blog --remote

      - name: Import WordPress content into D1
        run: npx wrangler d1 execute suhanur-blog --remote --file=migration-data/import.sql --yes

      - name: Verify imported content
        run: |
          npx wrangler d1 execute suhanur-blog --remote --json --command="SELECT 'posts' AS table_name, COUNT(*) AS count FROM posts UNION ALL SELECT 'categories', COUNT(*) FROM categories UNION ALL SELECT 'tags', COUNT(*) FROM tags UNION ALL SELECT 'comments', COUNT(*) FROM comments;"
