name = "suhanur-rahman-blog"
main = "vinext/server/fetch-handler"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "BLOG_DB"
database_name = "suhanur-blog"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOG_MEDIA"
bucket_name = "suhanur-blog-media"

[vars]
SITE_URL = "https://blog.suhanurrahman.com"
